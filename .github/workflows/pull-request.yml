name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-shared-pr-workflow:
    name: Run Shared Python PR Workflow
    uses: p2arthur/algokit-shared-config/.github/workflows/python-on-pull-request.yml@ci/release-workflow
    with:
      python-version: "3.12"
      run-tests: true
    secrets: inherit

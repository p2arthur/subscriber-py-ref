[tool.poetry]
name = "algokit-subscriber-python-reference"
version = "0.1.0"
description = "Reference Python subscriber library orchestrated via algokit-shared-config."
authors = ["Algorand Foundation"]
readme = "README.md"
package-mode = true
packages = [
    { include = "algokit_subscriber", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
python-semantic-release = "^9.8.2"
sphinx = "^8.1.0"
myst-parser = "^4.0.0"

[tool.poetry.scripts]
docs = "algokit_subscriber.cli:build_docs"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=algokit_subscriber --cov-report=term-missing"
testpaths = ["tests"]

[tool.semantic_release]
version_variable = "src/algokit_subscriber/init.py:version"
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "poetry build"
commit_message = "{version}\n\n[skip ci] automatically generated by python-semantic-release"

[tool.semantic_release.remote]
name = "origin"

[tool.semantic_release.remote.token]
env = "BOT_TOKEN"
